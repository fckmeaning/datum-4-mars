[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marsnav"
version = "0.1.0"
description = "Math core for Mars surface navigation: terrain, sun, environment, routing, orientation, orbits (F01-F53)."
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pyproj", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]

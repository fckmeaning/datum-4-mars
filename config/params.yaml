# config/params.yaml — contract v1. Every model parameter lives here; code never hardcodes these values.
# Each entry: value, unit, source (citation or ASSUMPTION), verify (true = check against the source), range (for Monte Carlo, F38).
# Owner: CEO. Change requests go through CONTRACT CHANGE REQUEST.
version: 1

constants:
  R_sphere:          { value: 3396190.0,    unit: m,        source: "MOLA-based Mars sphere" }
  g_mars:            { value: 3.721,        unit: m/s^2,    source: "NASA Mars fact sheet", verify: true }
  g_earth:           { value: 9.80665,      unit: m/s^2,    source: "standard gravity" }
  sol_seconds:       { value: 88775.244,    unit: s,        source: "Mars24 (Allison & McEwen 2000)" }
  S0_1au:            { value: 1361.0,       unit: W/m^2,    source: "total solar irradiance at 1 AU", verify: true }
  c_light:           { value: 299792458.0,  unit: m/s,      source: "SI definition" }
  GM_mars:           { value: 4.2828e13,    unit: m^3/s^2,  source: "Mars gravitational parameter", verify: true }
  J2_mars:           { value: 1.96e-3,      unit: "1",      source: "Mars J2", verify: true }
  W0_deg:            { value: 176.630,      unit: deg,      source: "IAU WGCCRE Mars rotation model", verify: true }
  Wdot_deg_per_day:  { value: 350.89198226, unit: deg/day,  source: "IAU WGCCRE Mars rotation model", verify: true }

atmosphere:
  scale_height_H:    { value: 11100.0, unit: m,   source: "Mars atmospheric scale height", verify: true }
  P_ref:             { value: 750.0,   unit: Pa,  source: "ASSUMPTION: typical REMS pressure at Gale", verify: true, range: [700, 900] }
  tau_default:       { value: 0.5,     unit: "1", source: "ASSUMPTION: dust optical depth, clear season", verify: true, range: [0.3, 1.0] }

radiation:
  dose_eq_ref:        { value: 0.64, unit: mSv/day, source: "Hassler et al. 2014, Science (RAD, Gale)", verify: true, range: [0.52, 0.76] }
  dose_abs_ref:       { value: 0.21, unit: mGy/day, source: "Hassler et al. 2014, Science (RAD, Gale)", verify: true }
  beta_pressure_dose: { value: 0.5,  unit: "1",     source: "ASSUMPTION: calibrate to RAD dose-pressure anticorrelation (Rafkin et al. 2014)", verify: true, range: [0.2, 0.8] }
  sky_weight_n:       { value: 1.0,  unit: "1",     source: "ASSUMPTION: zenith weighting sin^n(e) in F08", range: [0.0, 2.0] }
  sep_multiplier:     { value: 1.0,  unit: "1",     source: "scenario parameter; > 1 only in REPLAY/SIMULATED alerts" }

astronaut:
  mass_astronaut:     { value: 80.0,  unit: kg,  source: ASSUMPTION, range: [60, 100] }
  mass_suit:          { value: 90.0,  unit: kg,  source: "ASSUMPTION (order of an Apollo suit with life-support backpack)", verify: true, range: [60, 130] }
  mass_payload:       { value: 15.0,  unit: kg,  source: ASSUMPTION, range: [0, 30] }
  s_suit:             { value: 1.3,   unit: "1", source: "ASSUMPTION: suit walking inefficiency", range: [1.1, 1.6] }
  v_flat:             { value: 1.0,   unit: m/s, source: "ASSUMPTION (order of Apollo EVA walking speeds)", verify: true, range: [0.7, 1.3] }
  theta_max_walk_deg: { value: 25.0,  unit: deg, source: ASSUMPTION, range: [20, 30] }
  step_max:           { value: 0.5,   unit: m,   source: "ASSUMPTION (meaningful only at L3 resolution)" }
  T_suit_min_K:       { value: 173.0, unit: K,   source: "ASSUMPTION (-100 C)" }
  T_suit_max_K:       { value: 303.0, unit: K,   source: "ASSUMPTION (+30 C)" }
  eva_max_h:          { value: 7.0,   unit: h,   source: ASSUMPTION, range: [6, 8] }
  o2_capacity_l:      { value: 450.0, unit: L,   source: "ASSUMPTION (order of a portable life-support O2 supply)", verify: true, range: [300, 600] }
  reserve_fraction:   { value: 0.25,  unit: "1", source: ASSUMPTION }

physiology:
  o2_energy_equiv:    { value: 20.1,  unit: kJ/L,        source: "standard energetic equivalent of O2 (RQ ~0.82)" }
  met_o2:             { value: 3.5,   unit: mL/(kg*min), source: "definition of 1 MET" }

mobility:
  tobler_a:           { value: 3.5,   unit: "1", source: "Tobler 1993 hiking function" }
  tobler_b:           { value: 0.05,  unit: "1", source: "Tobler 1993 hiking function" }
  minetti_coeffs:     { value: [280.5, -58.7, -76.8, 51.9, 19.6, 2.5], unit: J/(kg*m), source: "Minetti et al. 2002, J Appl Physiol (i^5 ... i^0)" }
  minetti_grade_limit: { value: 0.45, unit: "1", source: "Minetti et al. 2002 measured range" }
  k_roughness:        { value: 1.0,   unit: "1", source: ASSUMPTION, range: [0.5, 2.0] }
  k_soft:             { value: 0.3,   unit: "1", source: ASSUMPTION, range: [0.1, 0.5] }

hazard:
  theta0_deg:         { value: 15.0,  unit: deg, source: ASSUMPTION }
  s_deg:              { value: 3.0,   unit: deg, source: ASSUMPTION }
  w_R:                { value: 0.5,   unit: "1", source: ASSUMPTION }
  w_rock:             { value: 0.5,   unit: "1", source: ASSUMPTION }
  w_tex:              { value: 0.25,  unit: "1", source: ASSUMPTION }
  w_sh:               { value: 0.3,   unit: "1", source: ASSUMPTION }
  w_th:               { value: 1.0,   unit: "1", source: ASSUMPTION }
  w_c:                { value: 0.5,   unit: "1", source: ASSUMPTION }

routing:
  connectivity:       { value: 16, unit: "1", source: "design" }
  grid_resolution_m:  { value: { L0: 20.0, L1: 200.0, L2: 20.0, L3: 5.0 }, unit: m, source: "design (D-02)" }
  nodata_policy:      { value: block, unit: "-", source: "design: block | penalty" }
  time_bucket_min:    { value: 30, unit: min, source: "design" }
  refs:
    tau_ref:          { value: 3600.0, unit: s,   source: "normalisation (ASSUMPTION)" }
    E_ref:            { value: 1.0e6,  unit: J,   source: "normalisation (ASSUMPTION)" }
    D_ref:            { value: 0.01,   unit: mSv, source: "normalisation (ASSUMPTION)" }
    Hz_ref:           { value: 1000.0, unit: m,   source: "normalisation (ASSUMPTION)" }
  profiles:
    FASTEST:  { w_tau: 1.0, w_E: 0.0, w_D: 0.0, w_H: 0.0, alpha: 0.0 }
    SAFEST:   { w_tau: 0.1, w_E: 0.1, w_D: 0.4, w_H: 0.4, alpha: 0.0 }
    BALANCED: { w_tau: 0.4, w_E: 0.2, w_D: 0.2, w_H: 0.2, alpha: 0.0 }
    SCIENCE:  { w_tau: 0.4, w_E: 0.2, w_D: 0.2, w_H: 0.2, alpha: 0.5 }

terrain:
  roughness_window:   { value: 5,     unit: cells, source: design }
  horizon_azimuths:   { value: 72,    unit: "1",   source: "ASSUMPTION (performance)" }
  r_near_m:           { value: 2000.0,  unit: m,   source: "ASSUMPTION (performance)" }
  r_far_m:            { value: 20000.0, unit: m,   source: "ASSUMPTION (performance)" }

navigation:
  comm_mask_deg:      { value: 10.0, unit: deg, source: ASSUMPTION }
  d_off_m:            { value: 25.0, unit: m,   source: ASSUMPTION }
  k_off:              { value: 3,    unit: fixes, source: ASSUMPTION }
  ellipse_p:          { value: 0.95, unit: "1", source: design }
  low_sun_warn_deg:   { value: 10.0, unit: deg, source: ASSUMPTION }

uncertainty:
  mc_runs:            { value: 100, unit: "1", source: design }
  seed:               { value: 42,  unit: "1", source: design }
